# This workflow build and push a Docker container to Google Artifact Registry
# and deploy it on Cloud Run when a commit is pushed to the "main"
# branch.
#
# To configure this workflow:
#
# 1. Enable the following Google Cloud APIs:
#
#    - Artifact Registry (artifactregistry.googleapis.com)
#    - Cloud Run (run.googleapis.com)
#    - IAM Credentials API (iamcredentials.googleapis.com)
#
#    You can learn more about enabling APIs at
#    https://support.google.com/googleapi/answer/6158841.
#
# 2. Create and configure a Workload Identity Provider for GitHub:
#    https://github.com/google-github-actions/auth#preferred-direct-workload-identity-federation.
#
#    Depending on how you authenticate, you will need to grant an IAM principal
#    permissions on Google Cloud:
#
#    - Artifact Registry Administrator (roles/artifactregistry.admin)
#    - Cloud Run Developer (roles/run.developer)
#
#    You can learn more about setting IAM permissions at
#    https://cloud.google.com/iam/docs/manage-access-other-resources
#
# 3. Change the values in the "env" block to match your values.

name: 'Build and Deploy to Cloud Run'

on:
  push:
    branches:
      - main # Corretto il bug delle virgolette di GitHub

env:
  PROJECT_ID: 'remix-mappa-fontanelle-804567845026'         # 👉 TODO: Inserisci l'ID del tuo progetto Google Cloud
  REGION: 'europe-west1'                     # 👉 TODO: Cambia la regione (es. europe-west1 per il server in Belgio)
  SERVICE: 'remix-mappa-fontanelle'          # 👉 TODO: Scegli il nome che vuoi dare al servizio su Cloud Run
  
  # Questo serve se usi Workload Identity (consigliato, vedi sotto). 
  # Se usi una normale chiave JSON Service Account, puoi cancellare o lasciare questa riga.
  WORKLOAD_IDENTITY_PROVIDER: 'projects/123456789/locations/global/workloadIdentityPools/my-pool/providers/my-provider' 

jobs:
  deploy:
    runs-on: 'ubuntu-latest'

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@v4'

      # 1. AUTENTICAZIONE SU GOOGLE CLOUD
      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: '${{ env.WORKLOAD_IDENTITY_PROVIDER }}'
          # Se preferisci usare le vecchie chiavi JSON invece di Workload Identity, 
          # cancella la riga sopra e decommenta la riga sotto salvando la chiave nei Secrets di GitHub:
          # credentials_json: '${{ secrets.GCP_SA_KEY }}'

      # 2. ACCESSO AL REGISTRY DOCKER DI GOOGLE
      - name: 'Docker Auth'
        uses: 'docker/login-action@v3'
        with:
          username: 'oauth2accesstoken'
          password: '${{ steps.auth.outputs.auth_token }}'
          registry: '${{ env.REGION }}-docker.pkg.dev'

      # 3. COSTRUZIONE E INVIO DEL CONTAINER (Legge il tuo Dockerfile)
      - name: 'Build and Push Container'
        run: |-
          DOCKER_TAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.SERVICE }}:${{ github.sha }}"
          docker build --tag "${DOCKER_TAG}" .
          docker push "${DOCKER_TAG}"

      # 4. DEPLOY SU CLOUD RUN
      - id: 'deploy'
        name: 'Deploy to Cloud Run'
        uses: 'google-github-actions/deploy-cloudrun@v2'
        with:
          service: '${{ env.SERVICE }}'
          region: '${{ env.REGION }}'
          image: '${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.SERVICE }}:${{ github.sha }}'
          # Questa riga indica a Cloud Run di accettare connessioni pubbliche da internet:
          flags: '--allow-unauthenticated'

      # 5. MOSTRA IL LINK DEL SITO COMPILATO
      - name: 'Show output'
        run: |-
          echo "Il tuo sito è live su: ${{ steps.deploy.outputs.url }}"
